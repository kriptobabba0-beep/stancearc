[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"


# Mixed-pragma workspace: Uniswap V3 fork is pinned to solc =0.7.6, all
# first-party Fee Arena code is ^0.8.20. Let forge pick the per-file solc.
auto_detect_solc = true

# The vendored =0.7.6 Uniswap V3 periphery needs OZ 3.4-solc-0.7 while first-party
# src/** (^0.8.20) needs OZ 4.9.x. Forge context-scoped remappings do not resolve
# reliably here (Windows), and both trees import the same @openzeppelin/contracts/
# path strings (e.g. token/ERC20/IERC20.sol) at DIFFERENT versions, so a single
# global remapping cannot serve both. Fix: the vendored v3-periphery imports were
# repointed to the `@oz3/` prefix (-> lib/openzeppelin-contracts-3.4 in
# remappings.txt); first-party keeps `@openzeppelin/` -> OZ 4.9.x untouched.
auto_detect_remappings = true

# 0.7.6 (v3-core/v3-periphery) cannot target prague/cancun. 'paris' is the
# safe common denominator across the 0.7.6 and 0.8.20 families.
evm_version = "paris"

# 0.7.6 is not via-ir compatible; keep the legacy pipeline for the whole build.
via_ir = false

optimizer = true
optimizer_runs = 200

# Fork tests read compiled creationCode via vm.getCode (artifact name -> out/),
# and the init-code-hash guard reads vendored periphery source under ./lib.
fs_permissions = [{ access = "read", path = "./out" }, { access = "read", path = "./lib" }]

# Dual-solc pin: the Uniswap V3 fork (v3-core/v3-periphery) is built with =0.7.6.
# Several of its files carry broad pragmas (>=0.5.0/>=0.4.0); without pinning them
# to 0.7.6 the version resolver tries to unify the 0.7.6 entrypoints with a 0.8.x
# build for the broad-range deps and errors ("Found incompatible versions"). These
# restrictions force the whole vendored V3 graph onto 0.7.6 so it compiles into out/
# for the fork tests to load via vm.getCode (first-party src/** stays 0.8.20).
[[profile.default.compilation_restrictions]]
paths = "lib/v3-core/**"
version = "=0.7.6"

[[profile.default.compilation_restrictions]]
paths = "lib/v3-periphery/**"
version = "=0.7.6"

[[profile.default.compilation_restrictions]]
paths = "test/fork/imports/**"
version = "=0.7.6"

# Fuzz / invariant budgets used by later test components.
[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false
call_override = false
shrink_run_limit = 5000

# ---------------------------------------------------------------------------
# CI profile (FOUNDRY_PROFILE=ci). Selected by .github/workflows/test.yml so
# that CI fuzzes/invariants HARDER than a laptop. Foundry profiles do NOT
# inherit scalar build keys or the compilation_restrictions arrays from
# [profile.default], so the entire dual-solc build config is replicated here
# verbatim - only the fuzz/invariant budgets below are raised. Keep these
# build keys in lockstep with [profile.default] above.
# ---------------------------------------------------------------------------
[profile.ci]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

auto_detect_solc = true
auto_detect_remappings = true
evm_version = "paris"
via_ir = false
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./out" }, { access = "read", path = "./lib" }]

# Dual-solc pin (mirrors [profile.default]): force the vendored Uniswap V3 fork
# graph onto =0.7.6 so it compiles into out/ for the fork tests to vm.getCode,
# while first-party src/** stays ^0.8.20.
[[profile.ci.compilation_restrictions]]
paths = "lib/v3-core/**"
version = "=0.7.6"

[[profile.ci.compilation_restrictions]]
paths = "lib/v3-periphery/**"
version = "=0.7.6"

[[profile.ci.compilation_restrictions]]
paths = "test/fork/imports/**"
version = "=0.7.6"

# Raised budgets: CI fuzzes harder than local (local default is runs=256).
[profile.ci.fuzz]
runs = 5000

[profile.ci.invariant]
runs = 1000
depth = 128
fail_on_revert = false
call_override = false
shrink_run_limit = 5000

# Arc testnet fork + broadcast endpoint (chainId 5042002). The env var is read
# from .env (see .env.example); never hardcode a key here.
[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"

[etherscan]
# ArcScan verification placeholder (no API key required on testnet for V0).
arc_testnet = { key = "${ARCSCAN_API_KEY}", url = "${ARCSCAN_URL}", chain = 5042002 }
