name: frontend-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Foundry + `forge build` so the ABI-drift test (test/feeArenaAbiDrift.test.ts) can load the
      # compiled artifact (out/FeeArena.sol/FeeArena.json) and assert abis/feeArena.ts still mirrors
      # the EpochView/StakeView/ClaimPreview tuples 1:1. Runs from the repo root, not frontend/.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Build contracts (artifacts for the ABI-drift test)
        working-directory: .
        run: forge build
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Prepare env for build
        run: cp .env.example .env.local
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
